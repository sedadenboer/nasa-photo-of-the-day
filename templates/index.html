<!DOCTYPE html>
<html>
<head>
    <title>NASA APOD</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>NASA Astronomy Picture of the Day</h1>

    <form method="get" action="/" class="date-picker-form">
        <input type="date" id="date" name="date" value="{{ request.query_params.get('date', '') }}">
        <button type="submit">Bekijk</button>
    </form>

    <hr>

    {% for item in data %}
        <div class="apod-container">
            <h2>{{ item.title }}</h2>
            <p class="date">{{ item.date }}</p>
            <img class="apod-image" src="{{ item.url }}" alt="{{ item.title }}" onclick="openLightbox(this)">
            <p class="explanation">{{ item.explanation }}</p>
        </div>
        <hr>
    {% endfor %}

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="">
        <span id="lightbox-close">Klik om te sluiten</span>
    </div>

    <script>
        function openLightbox(img) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = img.src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
